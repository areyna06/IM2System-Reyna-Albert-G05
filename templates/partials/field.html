<div class="field{% if field.errors %} has-error{% endif %}">
  {% if field.field.widget.input_type == "checkbox" %}
    <label class="check">{{ field }} <span>{{ field.label }}</span></label>
  {% else %}
    <label for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required %} <span class="req">*</span>{% endif %}</label>
    {{ field }}
  {% endif %}
  {% for error in field.errors %}<p class="error">{{ error }}</p>{% endfor %}
  {% if field.help_text and not field.errors %}<div class="help">{{ field.help_text|safe }}</div>{% endif %}
</div>
