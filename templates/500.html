{% load static %}<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Something went wrong</title>
  <link rel="stylesheet" href="{% static 'css/app.css' %}">
</head>
<body>
  {# Rendered without a request context, so it uses no user data, menus or messages. #}
  <main class="container narrow">
    <div class="card center">
      <h1>500 · Something went wrong</h1>
      <p class="muted">The server ran into a problem and could not finish your request. Nothing was saved. Please try again in a moment.</p>
      <a class="btn btn-primary" href="/">Go home</a>
    </div>
  </main>
</body>
</html>
