{% extends "base.html" %}
{% block title %}Access denied{% endblock %}
{% block container_class %}narrow{% endblock %}
{% block content %}
<div class="card center">
  <h1>403 · Access denied</h1>
  <p class="muted">You don't have permission to open this page.</p>
  {% if user.is_authenticated %}<a class="btn btn-primary" href="{% url 'dashboard' %}">Go to my dashboard</a>
  {% else %}<a class="btn btn-primary" href="{% url 'login' %}">Log in</a>{% endif %}
</div>
{% endblock %}
